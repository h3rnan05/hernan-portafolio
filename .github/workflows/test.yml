name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Provide placeholder env vars so Settings() instantiates during pytest collection
    env:
      DATABASE_URL: postgresql+asyncpg://x:y@localhost:5432/test
      DATABASE_URL_SYNC: postgresql+psycopg2://x:y@localhost:5432/test
      FRED_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check app scripts tests

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Las 680 pruebas del bot paper viven aquí, no en `backend/`.
  # Sin secrets, sin Alpaca, sin red: los tests mockean broker e IA.
  # No cambia umbrales ni modo paper -- solo corre lo que ya se
  # prueba en local (`python -m pytest momentum_hunter/tests
  # momentum_paper_trader/tests -q`).
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de prueba
        run: |
          pip install -q pytest
          pip install -q -r momentum_hunter/requirements.txt
          pip install -q -r momentum_paper_trader/requirements.txt

      - name: Tests momentum_hunter + momentum_paper_trader
        run: python -m pytest momentum_hunter/tests momentum_paper_trader/tests -q
