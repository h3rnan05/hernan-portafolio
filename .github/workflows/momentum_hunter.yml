# Momentum Opportunity Hunter -- pipeline en dos etapas (pivote
# 2026-07-26: "pensar como trader, no como screener"): etapa 1 escanea
# NYSE/NASDAQ/AMEX con barras diarias para recortar a un puñado de
# candidatos con catalizador; etapa 2 pide velas de 1 minuto SOLO para
# esos candidatos, detecta patrones de Ross Cameron y corre el árbol de
# decisión de 5 preguntas (ver momentum_hunter/evaluator.py) antes de
# mandar una alerta a Telegram. Proyecto completamente independiente del
# quant-screener (Investment Analyst del S&P 500): no comparte config,
# universo ni criterios.
#
# Corre varias veces al día en horario de mercado (aprox. 9:30am-4:00pm
# ET, ajustar el cron en horario de invierno) -- a diferencia del
# screener, que corre una vez antes de la apertura.
#
# `--limit 1000` por defecto (también en corridas programadas): escanear
# TODO el universo NYSE+NASDAQ+AMEX con Yahoo por-ticker en cada corrida
# es lento y arriesga que Yahoo bloquee la IP del runner (ver la
# limitación documentada en momentum_hunter/universe.py). Para producción
# real varias veces por hora, hay que inyectar un DataProvider de pago
# con cotizaciones masivas -- la abstracción ya lo permite.
#
# Bug real encontrado el 2026-08-20: `universe.py` ordena el universo por
# capitalización de mercado DESCENDENTE (ver ese módulo) -- con
# `--limit 500`, cualquier ticker que caiga en la posición 501+ por ese
# ranking NUNCA se escanea, sin importar qué tan en movimiento esté ese
# día. Moderna (MRNA) estaba en la posición #530 el día que se perdió la
# oportunidad -- ni siquiera llegó a pedirse su barra diaria, mucho menos
# a evaluarse. Subir a 1000 no elimina la clase de bug (cualquier límite
# fijo sigue teniendo un corte duro en algún punto), pero cubre con
# margen a acciones de mediana capitalización conocidas y líquidas como
# MRNA, que rotan alrededor de esa zona del ranking. Verificado contra
# las corridas reales: `--limit 500` tarda ~7-8 min (vs. 25 min de
# presupuesto) -- hay margen de sobra para duplicar la cobertura sin
# arriesgar el timeout ni acercarse al límite de Yahoo.
#
# Secrets (opcionales): MOMENTUM_TELEGRAM_BOT_TOKEN/_CHAT_ID (chat
# dedicado, recomendado) o, si no existen, cae a TELEGRAM_BOT_TOKEN/
# TELEGRAM_CHAT_ID (el mismo chat del Investment Analyst).

name: momentum-opportunity-hunter

on:
  schedule:
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Escanear solo los primeros N tickers (vacío = universo completo, lento)"
        required: false
        default: "1000"
      universo:
        description: "Ruta a un archivo de watchlist propio (vacío = NYSE+NASDAQ+AMEX completo)"
        required: false
        default: ""

concurrency:
  group: momentum-opportunity-hunter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cazar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -q -r momentum_hunter/requirements.txt

      - name: Correr Momentum Opportunity Hunter
        env:
          MOMENTUM_TELEGRAM_BOT_TOKEN: ${{ secrets.MOMENTUM_TELEGRAM_BOT_TOKEN }}
          MOMENTUM_TELEGRAM_CHAT_ID: ${{ secrets.MOMENTUM_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '1000' }}"
          UNIVERSO="${{ github.event.inputs.universo }}"
          ARGS=""
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ -n "$UNIVERSO" ] && ARGS="$ARGS --universo $UNIVERSO"
          python -m momentum_hunter.run $ARGS

      # Paper trading (pedido explícito 2026-08-12): consume las señales
      # TRIGGERED que acaba de resolver el paso de arriba y coloca
      # órdenes bracket en una cuenta de PRÁCTICA de Alpaca -- sistema
      # separado (ver momentum_paper_trader/README.md), nunca dinero
      # real. Sin ALPACA_PAPER_API_KEY/_SECRET, el comando no hace nada
      # (mismo principio que los secrets de Telegram).
      - name: Paper trading (Alpaca, cuenta de práctica)
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          # Capa de decisión con IA (ver momentum_paper_trader/ia_decision.py)
          # -- mismo secret que ya usan news_analyst.yml/wizards_bot.yml, sin
          # ANTHROPIC_API_KEY no se opera (fail-closed).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOMENTUM_TELEGRAM_BOT_TOKEN: ${{ secrets.MOMENTUM_TELEGRAM_BOT_TOKEN }}
          MOMENTUM_TELEGRAM_CHAT_ID: ${{ secrets.MOMENTUM_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q -r momentum_paper_trader/requirements.txt
          python -m momentum_paper_trader.run

      - name: Persistir universo/tracker/auditoría
        run: |
          git config user.name "momentum-opportunity-hunter"
          git config user.email "momentum-opportunity-hunter@users.noreply.github.com"
          for f in momentum_hunter/universo_cache.json momentum_hunter/alertas_enviadas.json \
                   momentum_hunter/estado_diario.json momentum_hunter/watchlist.json \
                   momentum_paper_trader/revisiones.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          # Auditoría completa de cada corrida (Principio 9: cada alerta
          # debe poder reconstruirse meses después) -- se committea igual
          # que el tracker, nunca se pierde la trazabilidad.
          [ -d momentum_hunter/auditoria ] && git add momentum_hunter/auditoria || true
          git diff --cached --quiet || git commit -m "momentum_hunter: alertas y auditoría del día [skip ci]"
          git pull --rebase origin main || true
          git push
