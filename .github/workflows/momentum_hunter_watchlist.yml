# Chequeo liviano de la watchlist persistida ("Fase 2" del detector de
# entradas, 2026-08-11, ver momentum_hunter/watchlist.py y README).
#
# El escaneo completo (momentum_hunter.yml) descubre candidatas nuevas
# cada ~30 minutos; este workflow SEPARADO solo re-evalúa las que YA
# están en WATCHING, sin re-escanear el universo ni pedir barras diarias
# -- eso permite un cron mucho más frecuente sin acercarse al límite real
# de Yahoo/GitHub Actions (ver la auditoría de frecuencia en el README:
# 5 minutos es el mínimo que GitHub Actions garantiza de forma
# confiable, no el "1 minuto ideal" original).
#
# Ya no comparte `concurrency.group` con momentum_hunter.yml: serializar
# ambos (cancel-in-progress: false) hacía que el escaneo completo
# encolara este re-chequeo y abriera huecos de hasta ~2,5 h. Cada
# workflow tiene su grupo. Los dos siguen escribiendo watchlist.json,
# así que un overlap raro es posible -- se prefiere eso a perder la
# cadencia.
#
# CADENCIA REAL. Este cron `*/5` sigue existiendo (fallback), pero GHA
# no lo honra: huecos medidos de ~2,5 h. El puente temporal
# `momentum_paper_cadence_bridge.yml` comparte ESTE mismo grupo
# (`momentum-opportunity-hunter-watchlist`) y itera en proceso cada
# ~5 min. No se re-mezcla con el grupo del hunter (PR #110). Apagar el
# puente no apaga este cron -- ver ese workflow y RUNBOOK-PAPER-CEO.
#
# Mismos secrets que momentum_hunter.yml -- ver ese archivo.

name: momentum-opportunity-hunter-watchlist

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: momentum-opportunity-hunter-watchlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -q -r momentum_hunter/requirements.txt

      - name: Re-chequear la watchlist activa
        env:
          MOMENTUM_TELEGRAM_BOT_TOKEN: ${{ secrets.MOMENTUM_TELEGRAM_BOT_TOKEN }}
          MOMENTUM_TELEGRAM_CHAT_ID: ${{ secrets.MOMENTUM_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m momentum_hunter.run --solo-watchlist

      # Paper trading (pedido explícito 2026-08-12): mismo paso que
      # momentum_hunter.yml -- ver ese archivo y momentum_paper_trader/README.md.
      - name: Paper trading (Alpaca, cuenta de práctica)
        # Una falla del trader nunca debe bloquear el paso de persistir
        # watchlist/alertas de momentum_hunter (que viene después) -- el
        # trader ya avisa sus propias fallas por Telegram (ver
        # momentum_paper_trader/run.py::_avisar_falla).
        continue-on-error: true
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          # Capa de decisión con IA (ver momentum_paper_trader/ia_decision.py)
          # -- mismo secret que ya usan news_analyst.yml/wizards_bot.yml, sin
          # ANTHROPIC_API_KEY no se opera (fail-closed).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOMENTUM_TELEGRAM_BOT_TOKEN: ${{ secrets.MOMENTUM_TELEGRAM_BOT_TOKEN }}
          MOMENTUM_TELEGRAM_CHAT_ID: ${{ secrets.MOMENTUM_TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q -r momentum_paper_trader/requirements.txt
          python -m momentum_paper_trader.run

      - name: Persistir watchlist/tracker/auditoría
        run: |
          git config user.name "momentum-opportunity-hunter"
          git config user.email "momentum-opportunity-hunter@users.noreply.github.com"
          for f in momentum_hunter/watchlist.json momentum_hunter/alertas_enviadas.json \
                   momentum_paper_trader/revisiones.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -d momentum_hunter/auditoria ] && git add momentum_hunter/auditoria || true
          # Telemetría del hunter. Paper telem la persiste el VPS, no GHA
          # (conflicto rebase sobre el JSON diario, run 34624961161).
          [ -d momentum_hunter/telemetria ] && git add momentum_hunter/telemetria || true
          if git diff --cached --quiet; then
            echo "INFO: nothing to persist"
          else
            git commit -m "momentum_hunter: re-chequeo de watchlist [skip ci]"
            PERSIST_BRANCH=main bash scripts/git_persist_rebase_push.sh
          fi
