# Learning Engine del Momentum Opportunity Hunter (Prompt 10) -- una vez
# al día, después del cierre, mide qué pasó con las alertas ya enviadas
# (retorno a 1/3/5/10 días) y calcula win rate / retorno promedio /
# drawdown / expectancy / Sharpe, todo en `momentum_hunter/stats.py`
# (deterministico, sin LLM). No manda nada a Telegram todavía -- las
# estadísticas quedan en el log de la corrida y en
# momentum_hunter/alertas_enviadas.json.

name: momentum-opportunity-hunter-outcomes

on:
  schedule:
    # 21:30 UTC = 4:30pm ET (verano) -- media hora después del cierre.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: momentum-opportunity-hunter-outcomes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -q -r momentum_hunter/requirements.txt

      - name: Actualizar resultados y calcular estadísticas
        run: python -m momentum_hunter.run --actualizar-resultados

      - name: Persistir tracker actualizado
        run: |
          git config user.name "momentum-opportunity-hunter"
          git config user.email "momentum-opportunity-hunter@users.noreply.github.com"
          [ -f momentum_hunter/alertas_enviadas.json ] && git add momentum_hunter/alertas_enviadas.json || true
          git diff --cached --quiet || git commit -m "momentum_hunter: actualiza resultados [skip ci]"
          git pull --rebase origin main || true
          git push
